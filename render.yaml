# Render Blueprint (opzionale): New → Blueprint → collega il repo.
# In alternativa crea a mano Postgres + Web Service e imposta le variabili come sotto.
#
# Web Service (manuale):
#   Root Directory: backend
#   Build:  pip install -r requirements.txt
#   Start:  uvicorn app.main:app --host 0.0.0.0 --port $PORT
#   Environment → DATABASE_URL = Internal Database URL del Postgres Render (Connect → copia URL interno)
#   Opzionale se il log mostra errori SSL: DATABASE_SSL_REQUIRE=true
#   Opzionale se la connessione interna non accetta SSL: DATABASE_SSL_DISABLE=true

databases:
  - name: fornitori-postgres
    plan: free
    region: frankfurt

services:
  - type: web
    name: fornitori-app
    plan: free
    region: frankfurt
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fornitori-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOW_STARTUP_DB_FAILURE
        value: "true"
    healthCheckPath: /health
